[project]
name = "agent-office"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "openai",
    "openpyxl",
    "python-dotenv",
    "pydantic>=2.0"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (syntax / undefined names)
    "I",   # isort (automatically sort imports)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = [
    "E501",  # line-too-long (handled automatically by ruff format)
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

